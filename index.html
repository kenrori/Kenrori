<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kho Game & Dịch Thuật của Kenrori</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b2033;--mu:#6a7288;--ac:#6558f5;--ac2:#b05cf5;--bd:#e4e7f1;--sh:0 8px 26px #1b20331c;--fs:18px}
:root[data-theme=dark]{--bg:#0f1117;--card:#1a1d29;--tx:#e8eaf2;--mu:#9aa2b8;--ac:#8b84ff;--ac2:#c47dff;--bd:#2b3042;--sh:0 8px 26px #0008}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1117;--card:#1a1d29;--tx:#e8eaf2;--mu:#9aa2b8;--ac:#8b84ff;--ac2:#c47dff;--bd:#2b3042;--sh:0 8px 26px #0008}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:var(--tx)}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;padding:26px 16px 30px;border-radius:0 0 28px 28px;box-shadow:var(--sh)}
.hero .in{max-width:980px;margin:auto}.hero .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hero h1{margin:0;font-size:1.65rem;letter-spacing:-.3px}.hero p{margin:6px 0 0;opacity:.92}
#th{border:0;background:#ffffff33;color:#fff;border-radius:50%;width:40px;height:40px;font-size:1.15rem;cursor:pointer;flex:none}
.sb{margin-top:16px}.sb input{width:100%;border:0;border-radius:14px;padding:13px 18px;font-size:1rem;background:#fff;color:#1b2033;box-shadow:0 4px 16px #0003;outline:none}
.hero.slim{padding:12px 16px;border-radius:0 0 18px 18px}.hero.slim p,.hero.slim .sb{display:none}.hero.slim h1{font-size:1.1rem}
.bar{display:flex;gap:8px;max-width:980px;margin:auto;padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;overflow-x:auto;scrollbar-width:none}
.bar button{flex:none;border:1px solid var(--bd);background:var(--card);border-radius:999px;padding:9px 16px;cursor:pointer;white-space:nowrap;transition:.15s}
.bar button:hover{border-color:var(--ac)}
.bar button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-color:transparent;box-shadow:0 4px 12px #6558f555}
main,#view{max-width:980px;margin:auto;padding:4px 16px 70px}
.lead{color:var(--mu);margin:4px 0 14px}
section{display:none}section.on{display:block;animation:in .25s}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.card,details{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:0 1px 3px #1b20330d;transition:.2s}
.card:hover,details:hover{box-shadow:var(--sh)}
details{margin-bottom:12px}summary{cursor:pointer;font-weight:600;padding:2px 0}
.card h3{margin:0 0 6px;font-size:1.08rem}.card p,details p{margin:6px 0;color:var(--mu);font-size:.94rem}
.tag{display:inline-block;font-size:.75rem;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:0 9px;margin-right:4px;color:var(--mu)}
details img{max-width:100%;border-radius:12px;margin-top:10px;cursor:zoom-in}
iframe,video{width:100%;border:1px solid var(--bd);border-radius:12px;background:#000;aspect-ratio:16/9;margin-top:8px}iframe.tool{aspect-ratio:auto;height:480px}
textarea{width:100%;min-height:80px;margin-top:8px;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg)}
.tb button,.btn{border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block;margin-top:8px}
[disabled]{opacity:.35;pointer-events:none}
.sc{text-decoration:none;color:var(--tx)}.sc small{color:var(--mu);display:block;margin-top:6px;font-size:.82rem}
.cover{position:relative;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 60% 48%),hsl(calc(var(--h) + 50) 60% 26%));box-shadow:0 6px 18px #0004;transition:.25s}
.sc:hover .cover{transform:translateY(-5px);box-shadow:0 12px 28px #0005}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:.4s}.sc:hover .cover img{transform:scale(1.05)}
.cover b{position:absolute;left:0;right:0;bottom:0;padding:36px 11px 11px;color:#fff;font-size:1.05rem;line-height:1.25;text-shadow:0 1px 4px #000a;background:linear-gradient(transparent,#000e)}
.cover em{position:absolute;top:9px;left:9px;background:#000a;color:#fff;font-style:normal;font-size:.72rem;padding:3px 9px;border-radius:20px;backdrop-filter:blur(4px)}
.hd{display:flex;gap:20px;margin:14px 0;flex-wrap:wrap}.hd .cover{width:180px}.hd>div:last-child{flex:1;min-width:220px}.hd h2{font-size:1.5rem}
.bar2{display:flex;gap:8px;margin:14px 0}.bar2 input{flex:1;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 14px}
.bar2 button,select{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:9px 14px;cursor:pointer}
.ch{display:flex;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:var(--card);text-decoration:none;color:var(--tx);transition:.15s}
.ch:hover{border-color:var(--ac);transform:translateX(3px)}.ch.done{opacity:.55}.ch small{color:var(--mu);white-space:nowrap}
.nv{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:12px 0}.nv select{max-width:42%}.nv .btn{margin:0}
#rd.novel{font-size:var(--fs);line-height:1.9;max-width:720px;margin:16px auto;padding:22px 22px;border-radius:16px;background:var(--card);border:1px solid var(--bd)}
#rd.novel.sepia{background:#f4ecd8;color:#3b3226;border-color:#e3d6b5}#rd.novel.night{background:#08090d;color:#c9cdd9;border-color:#1c1f2b}
#rd.manga{max-width:800px;margin:12px auto}#rd.manga img{display:block;width:100%;min-height:200px}
.fz{float:right;display:flex;gap:6px}.fz button{border:1px solid var(--bd);background:var(--card);border-radius:10px;padding:4px 11px;cursor:pointer}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));z-index:30;opacity:0;transition:width .1s}
#up{position:fixed;right:16px;bottom:18px;width:46px;height:46px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;font-size:1.3rem;cursor:pointer;box-shadow:var(--sh);z-index:15}
#lb{display:none;position:fixed;inset:0;background:#000d;z-index:40;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}#lb img{max-width:100%;max-height:100%;border-radius:10px}
.empty{color:var(--mu);padding:28px 0;text-align:center}
footer{text-align:center;color:var(--mu);font-size:.85rem;padding:10px 16px 30px}
@media(max-width:560px){.hero h1{font-size:1.35rem}.hd .cover{width:130px}.nv select{max-width:100%;order:3;width:100%}}
</style>
</head>
<body>
<header class="hero"><div class="in"><div class="top"><h1>🎮 Kho Game & Dịch Thuật</h1><button id="th" title="Đổi giao diện sáng/tối">🌓</button></div><p>Mẹo game, công cụ, novel, manga và video Vietsub — tất cả ở một nơi.</p><div class="sb"><input id="q" type="search" placeholder="🔍 Tìm mẹo, truyện, công cụ..."></div></div></header>
<div class="bar" id="tabs"></div>
<main id="app"></main>
<div id="view" hidden></div>
<div id="pg"></div><button id="up" hidden title="Lên đầu trang">↑</button>
<div id="lb"><img alt=""></div>
<footer>Làm với ❤️ bởi Kenrori · Chạy trên GitHub Pages</footer>
<script>
/* ============ DATA: CHỈ CẦN SỬA PHẦN NÀY ============ */
const DATA = {
  tips: [
    { title: "Cách farm Raid nhanh (ví dụ)", game: "Granblue Fantasy", text: "Viết mẹo ở đây. Bấm vào ảnh để phóng to.", img: "images/vi-du-1.png" }
  ],
  links: [
    { title: "Greasyfork", url: "https://greasyfork.org/", desc: "Kho userscript.", tags: ["script"] },
    { title: "NovelUpdates", url: "https://www.novelupdates.com/", desc: "Tra cứu novel.", tags: ["novel"] },
    { title: "Nexus Mods", url: "https://www.nexusmods.com/", desc: "Kho mod game.", tags: ["mod"] }
  ],
  guides: [ /* giải thích công cụ bằng ảnh; embed: "https://..." để nhúng công cụ web */
    { title: "Hướng dẫn cài userscript (ví dụ)", text: "Cài Tampermonkey → mở link script → bấm Install.", img: "images/tool-1.png", embed: "" }
  ],
  novels: [ /* chương: dùng file: "novels/ten/c1.txt" (mỗi dòng = 1 đoạn) hoặc text: "..." */
    { slug: "vi-du-novel", title: "Tên Light Novel (ví dụ)", author: "Tác giả", status: "Đang dịch", cover: "images/bia-1.jpg",
      desc: "Giới thiệu ngắn về bộ truyện.",
      chapters: [
        { t: "Chương 1: Khởi đầu", date: "2026-11-01", text: "Đây là đoạn mở đầu.\nĐoạn thứ hai của chương 1." },
        { t: "Chương 2: Gặp gỡ", date: "2026-11-05", text: "Nội dung chương 2.\nThêm một đoạn nữa." },
        { t: "Chương 3: Hành trình", date: "2026-11-12", file: "novels/vi-du-novel/c3.txt", words: 3200 }
      ] }
  ],
  manga: [ /* trang: pages:[url,...] hoặc dir + n (+ pad, ext) → dir/01.jpg ... */
    { slug: "vi-du-manga", title: "Tên Manga (ví dụ)", author: "Tác giả", status: "Hoàn thành", cover: "images/bia-2.jpg",
      desc: "Giới thiệu ngắn.",
      chapters: [
        { t: "Chương 1", date: "2026-11-02", dir: "manga/vi-du-manga/c1/", n: 20, pad: 2, ext: "jpg" },
        { t: "Chương 2", date: "2026-11-09", dir: "manga/vi-du-manga/c2/", n: 18, pad: 2, ext: "jpg" }
      ] }
  ],
  videos: [
    { title: "Bài hát Vietsub (YouTube)", youtube: "dQw4w9WgXcQ", desc: "Thay ID bằng video của bạn." },
    { title: "Bài hát Vietsub (file trong repo)", mp4: "videos/bai-hat.mp4", vtt: "videos/bai-hat.vi.vtt", desc: "Phụ đề .vtt hiện trong trình phát." }
  ]
};
/* ============ CÔNG CỤ TÍCH HỢP ============ */
const W = x => x.trim() ? x.trim().split(/\s+/).length : 0;
const TOOLS = [
 { t: "Đếm chữ & ký tự", fn: x => `${W(x)} chữ · ${x.length} ký tự · ${x.split("\n").filter(l => l.trim()).length} đoạn` },
 { t: "Dọn văn bản", h: "Xóa khoảng trắng thừa, gộp dòng trống.", fn: x => x.replace(/\r/g, "").replace(/[ \t]+/g, " ").replace(/ ?\n ?/g, "\n").replace(/\n{3,}/g, "\n\n").trim() },
 { t: "Nối dòng bị ngắt (PDF/OCR)", h: "Nối các dòng bị ngắt giữa câu, giữ dòng trống giữa đoạn.", fn: x => x.replace(/\r/g, "").replace(/([^\n])\n(?!\n)/g, "$1 ") },
 { t: "Tìm & thay hàng loạt (tên riêng)", h: "Ô dưới: mỗi dòng một cặp từ cũ=từ mới.", x: "từ cũ=từ mới", fn: (x, g) => g.split("\n").filter(l => l.includes("=")).reduce((s, l) => { const [a, ...b] = l.split("="); return a.trim() ? s.split(a.trim()).join(b.join("=").trim()) : s }, x) },
 { t: "Bỏ dấu & tạo slug", h: "Dùng đặt tên thư mục/file.", fn: x => x.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "D").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") },
 { t: "SRT → VTT (phụ đề Vietsub)", h: "Chuyển phụ đề .srt sang .vtt để dùng với video HTML.", fn: x => "WEBVTT\n\n" + x.replace(/\r/g, "").replace(/(\d\d:\d\d:\d\d),(\d{3})/g, "$1.$2").trim() },
 { t: "Tách chương → JSON", h: "Dán cả truyện; dòng bắt đầu bằng từ khóa (ô dưới, mặc định “Chương”) là chương mới. Kết quả dán vào chapters:[...].", x: "Chương", fn: (x, k) => { k = k.trim() || "Chương"; const d = new Date().toISOString().slice(0, 10), o = []; let c; x.replace(/\r/g, "").split("\n").forEach(l => { if (l.trim().startsWith(k)) { c = { t: l.trim(), date: d, w: [] }; o.push(c) } else if (c) c.w.push(l) }); return JSON.stringify(o.map(c => { const tx = c.w.join("\n").trim(); return { t: c.t, date: c.date, words: W(tx), text: tx } }), null, 1) } },
 { t: "Tạo danh sách trang manga", h: "Ô trên để trống. Ô dưới: thư mục|số trang|đuôi file", x: "manga/ten/c1/|20|jpg", fn: (_, p) => { const [d, n, e] = p.split("|").map(s => s.trim()); return JSON.stringify(Array.from({ length: +n }, (_, i) => d + String(i + 1).padStart(2, "0") + "." + (e || "jpg")), null, 1) } }
];
/* ============ CODE ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtD = d => d ? d.split("-").reverse().join("/") : "";
const fmtN = n => n ? Number(n).toLocaleString("vi-VN") + " chữ" : "";
const hue = t => [...t].reduce((a, c) => a + c.charCodeAt(0), 0) % 360;
const ls = { get: k => { try { return localStorage.getItem(k) } catch (e) {} }, set: (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} } };
const imgTag = s => s ? `<img src="${esc(s)}" alt="" loading="lazy" onerror="this.remove()">` : "";
const TABS = [["tips", "💡 Mẹo game"], ["links", "🔗 Liên kết"], ["tools", "🛠️ Công cụ"], ["novels", "📖 Novel"], ["manga", "🖼️ Manga"], ["videos", "🎵 Video Vietsub"]];
const LEAD = { tips: "Bấm vào từng mục để xem chi tiết, bấm vào ảnh để phóng to.", links: "Những website hữu ích, bấm để mở trong tab mới.", tools: "Công cụ chạy ngay trên trang: dán nội dung, bấm Chạy, rồi sao chép kết quả.", novels: "Chọn một bộ để xem danh sách chương và bắt đầu đọc.", manga: "Chọn một bộ để xem danh sách chương và bắt đầu đọc.", videos: "Video nhạc Vietsub, có thể bật phụ đề Việt trong trình phát." };
const V = $("#view"), app = $("#app"), tabs = $("#tabs");

const card = (k, s) => { const lt = s.chapters.map(c => c.date).sort().pop(); return `<a class="sc" href="#${k}/${s.slug}"><div class="cover" style="--h:${hue(s.title)}">${imgTag(s.cover)}<em>${esc(s.status)}</em><b>${esc(s.title)}</b></div><small>${s.chapters.length} chương · cập nhật ${fmtD(lt)}</small></a>` };
const toolUI = (t, i) => `<details class="tb" data-t="${esc(t.t)}"><summary>${esc(t.t)}</summary>${t.h ? `<p>${esc(t.h)}</p>` : ""}<textarea class="i" placeholder="Dán nội dung vào đây..."></textarea>${t.x ? `<textarea class="x" placeholder="${esc(t.x)}"></textarea>` : ""}<button onclick="runTool(${i},this)">Chạy</button> <button onclick="copyOut(this)">Sao chép kết quả</button><textarea class="o" readonly placeholder="Kết quả"></textarea></details>`;
function runTool(i, b) { const d = b.closest(".tb"), o = $(".o", d); try { o.value = TOOLS[i].fn($(".i", d).value, $(".x", d)?.value || "") } catch (e) { o.value = "Lỗi: " + e.message } }
function copyOut(b) { const o = $(".o", b.closest(".tb")); o.select(); navigator.clipboard?.writeText(o.value) }

const R = {
  tips: d => `<details><summary>${esc(d.title)} <span class="tag">${esc(d.game)}</span></summary><p>${esc(d.text)}</p>${imgTag(d.img)}</details>`,
  links: d => `<div class="card"><h3><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></h3><p>${esc(d.desc)}</p>${(d.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")}</div>`,
  guides: d => `<details><summary>${esc(d.title)}</summary><p>${esc(d.text)}</p>${imgTag(d.img)}${d.embed ? `<iframe class="tool" src="${esc(d.embed)}" loading="lazy"></iframe>` : ""}</details>`,
  videos: d => `<div class="card"><h3>${esc(d.title)}</h3><p>${esc(d.desc)}</p>` + (d.youtube ? `<iframe src="https://www.youtube-nocookie.com/embed/${esc(d.youtube)}" allowfullscreen loading="lazy"></iframe>` : `<video controls preload="none" src="${esc(d.mp4)}">${d.vtt ? `<track kind="subtitles" srclang="vi" label="Tiếng Việt" src="${esc(d.vtt)}" default>` : ""}</video>`) + `</div>`
};
tabs.innerHTML = TABS.map(([k, l]) => `<button data-k="${k}">${l}</button>`).join("");
app.innerHTML = TABS.map(([k]) => `<section id="s-${k}"></section>`).join("");

function render(f = "") {
  f = f.trim().toLowerCase(); const m = d => !f || JSON.stringify(d).toLowerCase().includes(f);
  const set = (k, h, c) => $("#s-" + k).innerHTML = `<p class="lead">${LEAD[k]}</p>` + (h ? `<div class="${c || ""}">${h}</div>` : `<p class="empty">😕 Không tìm thấy kết quả phù hợp.</p>`);
  set("tips", DATA.tips.filter(m).map(R.tips).join(""));
  set("links", DATA.links.filter(m).map(R.links).join(""), "grid");
  set("tools", DATA.guides.filter(m).map(R.guides).join("") + TOOLS.map((t, i) => [t, i]).filter(([t]) => !f || t.t.toLowerCase().includes(f)).map(([t, i]) => toolUI(t, i)).join(""));
  set("novels", DATA.novels.filter(m).map(s => card("novel", s)).join(""), "series");
  set("manga", DATA.manga.filter(m).map(s => card("manga", s)).join(""), "series");
  set("videos", DATA.videos.filter(m).map(R.videos).join(""), "grid");
}
function showTab(k) {
  V.hidden = true; app.hidden = tabs.hidden = false;
  TABS.forEach(([t]) => $("#s-" + t).classList.toggle("on", t === k));
  tabs.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.k === k));
}
tabs.addEventListener("click", e => { const b = e.target.closest("button"); if (b) location.hash = "#" + b.dataset.k });
$("#q").addEventListener("input", e => render(e.target.value));
app.addEventListener("click", e => { if (e.target.matches("details img")) { $("#lb img").src = e.target.src; $("#lb").style.display = "flex" } });
$("#lb").onclick = () => $("#lb").style.display = "none";

let fs = +ls.get("fs") || 18; document.documentElement.style.setProperty("--fs", fs + "px");
function fz(d) { fs = Math.min(32, Math.max(14, fs + d * 2)); document.documentElement.style.setProperty("--fs", fs + "px"); ls.set("fs", fs) }

function detail(kind, s) {
  const last = ls.get(kind + ":" + s.slug), back = kind === "novel" ? "novels" : "manga"; let desc = true; const rs = rdSet(kind, s);
  V.innerHTML = `<a href="#${back}">← Quay lại</a><div class="hd"><div class="cover" style="--h:${hue(s.title)}">${imgTag(s.cover)}<b>${esc(s.title)}</b></div><div><h2>${esc(s.title)}</h2><p class="mu">${esc(s.author)} · ${esc(s.status)} · ${s.chapters.length} chương</p><p>${esc(s.desc)}</p><a class="btn" href="#${kind}/${s.slug}/${last || 0}">${last ? "Đọc tiếp" : "Đọc từ đầu"}</a></div></div><div class="bar2"><input id="cq" type="search" placeholder="Tìm chương (tên hoặc số)..."><button id="cs">↕ Mới nhất trước</button></div><div id="cl"></div>`;
  const draw = () => {
    const q = $("#cq").value.trim().toLowerCase(); let L = s.chapters.map((c, i) => ({ c, i })).filter(({ c }) => !q || c.t.toLowerCase().includes(q)); if (desc) L.reverse();
    $("#cl").innerHTML = L.map(({ c, i }) => { const info = kind === "novel" ? (fmtN(c.words || (c.text ? W(c.text) : 0)) || "—") : (c.pages ? c.pages.length : c.n) + " trang"; return `<a class="ch${rs.includes(i) ? " done" : ""}" href="#${kind}/${s.slug}/${i}"><span>${esc(c.t)}${i == last ? " ★" : ""}</span><small>${fmtD(c.date)} · ${info}</small></a>` }).join("") || `<p class="empty">Không tìm thấy chương.</p>`;
  };
  $("#cq").oninput = draw; $("#cs").onclick = e => { desc = !desc; e.target.textContent = desc ? "↕ Mới nhất trước" : "↕ Cũ nhất trước"; draw() }; draw();
}
async function read(kind, s, i) {
  const c = s.chapters[i]; if (!c) { location.hash = `#${kind}/${s.slug}`; return }
  ls.set(kind + ":" + s.slug, i); const rs = rdSet(kind, s); if (!rs.includes(i)) { rs.push(i); ls.set("r:" + kind + ":" + s.slug, JSON.stringify(rs)) }
  const base = `#${kind}/${s.slug}`, n = s.chapters.length;
  const nav = `<div class="nv"><a class="btn" ${i > 0 ? `href="${base}/${i - 1}"` : "disabled"}>← Trước</a><a href="${base}">Mục lục</a><select onchange="location.hash='${base}/'+this.value">${s.chapters.map((x, j) => `<option value="${j}" ${j == i ? "selected" : ""}>${esc(x.t)}</option>`).join("")}</select><a class="btn" ${i < n - 1 ? `href="${base}/${i + 1}"` : "disabled"}>Sau →</a></div>`;
  V.innerHTML = (kind === "novel" ? `<div class="fz"><button onclick="fz(-1)">A−</button> <button onclick="fz(1)">A+</button><button onclick="rm()">🎨 Nền</button></div>` : "") + `<h2>${esc(s.title)}</h2><p class="mu" id="meta">${esc(c.t)} · ${fmtD(c.date)}</p>${nav}<article id="rd" class="${kind} ${kind === "novel" ? (ls.get("rt") || "") : ""}"></article>${nav}`;
  const rd = $("#rd");
  if (kind === "novel") {
    let t = c.text;
    if (t == null) { rd.textContent = "Đang tải..."; try { const r = await fetch(c.file); if (!r.ok) throw 0; t = await r.text() } catch (e) { rd.innerHTML = "<p>Không tải được chương. Hãy chạy trên GitHub Pages hoặc server cục bộ (không mở file trực tiếp).</p>"; return } }
    rd.innerHTML = t.split(/\n+/).filter(l => l.trim()).map(l => `<p>${esc(l)}</p>`).join("");
    $("#meta").textContent += " · " + fmtN(c.words || W(t));
  } else {
    const pg = c.pages || Array.from({ length: c.n }, (_, k) => c.dir + String(k + 1).padStart(c.pad || 2, "0") + "." + (c.ext || "jpg"));
    rd.innerHTML = pg.map(u => `<img src="${esc(u)}" alt="" loading="lazy">`).join("");
  }
  scrollTo(0, 0);
}
function route() {
  const [a, b, c] = decodeURIComponent(location.hash.slice(1)).split("/");
  const s = b && (a === "novel" ? DATA.novels : a === "manga" ? DATA.manga : []).find(x => x.slug === b);
  $(".hero").classList.toggle("slim", !!s);
  if (s) { app.hidden = tabs.hidden = true; V.hidden = false; scrollTo(0, 0); c !== undefined ? read(a, s, +c) : detail(a, s); return }
  showTab(TABS.some(([k]) => k === a) ? a : "tips");
}
const rdSet = (k, s) => { try { return JSON.parse(ls.get("r:" + k + ":" + s.slug) || "[]") } catch (e) { return [] } };
function rm() { const o = ["", "sepia", "night"], n = o[(o.indexOf(ls.get("rt") || "") + 1) % 3]; ls.set("rt", n); const r = $("#rd.novel"); if (r) r.className = "novel " + n }
const root = document.documentElement; if (ls.get("theme")) root.dataset.theme = ls.get("theme");
$("#th").onclick = () => { const cur = root.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"), n = cur === "dark" ? "light" : "dark"; root.dataset.theme = n; ls.set("theme", n) };
addEventListener("scroll", () => { const h = document.documentElement.scrollHeight - innerHeight; $("#pg").style.width = (h > 0 ? scrollY / h * 100 : 0) + "%"; $("#pg").style.opacity = $("#rd") ? 1 : 0; $("#up").hidden = scrollY < 600 }, { passive: true });
$("#up").onclick = () => scrollTo({ top: 0, behavior: "smooth" });
addEventListener("hashchange", route);
(async () => { try { const r = await fetch("data.json?v=" + Date.now()); if (r.ok) Object.assign(DATA, await r.json()) } catch (e) {} render(); route() })();
</script>
