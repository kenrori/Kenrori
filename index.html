<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kenrori</title>
<link rel="alternate" type="application/rss+xml" title="Kenrori" href="feed.xml">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ff00ff">
<link rel="icon" type="image/png" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="description" content="Light novel, web novel, manga dịch tiếng Việt, video Vietsub và công cụ game.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="fonts/beaufort-medium.woff" as="font" type="font/woff" crossorigin><link rel="preload" href="fonts/beaufort-bold.woff" as="font" type="font/woff" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=M+PLUS+1:wght@500;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Beaufort";src:url(fonts/beaufort-medium.woff) format("woff");font-weight:100 650;font-style:normal;font-display:swap}
@font-face{font-family:"Beaufort";src:url(fonts/beaufort-bold.woff) format("woff");font-weight:651 1000;font-style:normal;font-display:swap}
:root{--fd:"Beaufort","M PLUS 1","Be Vietnam Pro",system-ui,sans-serif;--fb:"Beaufort","M PLUS 1","Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--ink:#15131f;--obi:#ffd84d;--bg:#fbfaff;--s1:#f0eef8;--s2:#e4e1f0;--tx:#16141f;--mu:#6c6a7a;--ac:#ff00ff;--ach:#d600d6;--acs:#ffe3ff;--bd:#e3e0ee;--on:#04a74b;--done:#2f7de1;--pause:#e89a00;--side:256px;--top:56px}
:root[data-theme=dark]{--bg:#15131f;--s1:#201d2d;--s2:#2d2940;--tx:#f3f2f8;--mu:#a7a3b8;--ac:#ff00ff;--ach:#ff4dff;--acs:#3d1440;--bd:#2c2939}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#15131f;--s1:#201d2d;--s2:#2d2940;--tx:#f3f2f8;--mu:#a7a3b8;--ac:#ff00ff;--ach:#ff4dff;--acs:#3d1440;--bd:#2c2939}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.6 var(--fb);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:var(--tx)}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
::selection{background:var(--ac);color:#fff}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Sidebar ---------- */
#side{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--s1);padding:12px 12px 20px;overflow-y:auto;z-index:60;display:flex;flex-direction:column;transition:transform .25s ease}
.sl{display:flex;align-items:center;justify-content:space-between;height:40px;padding:0 6px;margin-bottom:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--ac);color:#fff;display:grid;place-items:center;font-style:normal;font-size:1rem}
#sx{display:none;border:0;background:none;padding:6px;border-radius:6px}#sx:hover{background:var(--s2)}
#nv{display:flex;flex-direction:column;gap:2px}
#nv .sg{display:flex;align-items:center;gap:10px;font-weight:700;padding:14px 10px 4px}
#nv a{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 40px;border-radius:6px;font-weight:500}
#nv a.top{padding-left:10px;font-weight:700}
#nv a:hover{background:var(--s2)}#nv a.on{background:var(--ac);color:#fff}
.sfoot{margin-top:auto;padding:18px 10px 0;display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--mu)}
.sfoot a:hover{color:var(--ac)}
.dcb{display:flex;align-items:center;justify-content:center;gap:8px;background:#5865f2;color:#fff!important;border-radius:6px;padding:8px;font-weight:600;margin-bottom:8px}
#scrim{display:none;position:fixed;inset:0;background:#0007;z-index:55}
#main{margin-left:var(--side);min-height:100vh;display:flex;flex-direction:column}
body.ov #side{transform:translateX(-100%)}body.ov #main{margin-left:0}
body.ov.so #side{transform:none;box-shadow:0 0 40px #0005}body.ov.so #scrim{display:block}body.ov #sx{display:block}

/* ---------- Top bar ---------- */
#top{position:sticky;top:0;z-index:50;height:var(--top);display:flex;align-items:center;gap:10px;padding:0 24px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);transition:background .2s,border-color .2s,color .2s}
#top .logo{display:none;font-size:1.1rem}body.ov #top .logo{display:flex}
.ib{border:0;background:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:inherit}.ib:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.srch{margin-left:auto;position:relative;width:min(340px,100%)}
.srch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--mu);pointer-events:none}
#q{width:100%;border:0;background:var(--s1);border-radius:8px;padding:8px 12px 8px 36px;outline:none}
#q:focus{box-shadow:0 0 0 2px var(--ac)}
body.clear #top{background:transparent;border-color:transparent;color:#fff;-webkit-backdrop-filter:none;backdrop-filter:none}
body.clear #q{background:#ffffff26;color:#fff}body.clear #q::placeholder{color:#ffffffb0}body.clear .srch svg{color:#fffc}
#ann{background:var(--ac);color:#fff;text-align:center;padding:7px 44px 7px 14px;position:relative;font-size:.9rem;font-weight:500}
#ann a{text-decoration:underline}#ann button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:1.1rem}

/* ---------- Layout ---------- */
#app{flex:1;padding:0 24px 56px;width:100%;max-width:1440px;margin:0 auto}
.sec{margin:30px 0}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.sh h2{margin:0;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
.more{width:36px;height:36px;border-radius:50%;background:var(--s1);display:grid;place-items:center}.more:hover{background:var(--s2)}
.lead{color:var(--mu);margin:-6px 0 14px}
.empty{color:var(--mu);padding:26px 0;text-align:center}
footer{padding:22px 24px 30px;color:var(--mu);font-size:.85rem;border-top:1px solid var(--bd);display:flex;gap:16px;flex-wrap:wrap}
footer a:hover{color:var(--ac)}

/* ---------- Hero ---------- */
.hero{position:relative;height:470px;margin:calc(-1 * var(--top)) -24px 8px;overflow:hidden;background:#111}
.hs{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .7s,visibility .7s}.hs.on{opacity:1;visibility:visible}
.hb{position:absolute;inset:0;background:linear-gradient(160deg,hsl(var(--h) 55% 42%),hsl(calc(var(--h) + 50) 55% 20%));background-size:cover;background-position:center 25%;filter:blur(4px);transform:scale(1.08)}
.hs::after,.tpb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#000b 0%,#0008 55%,color-mix(in srgb,var(--bg) 60%,#0008) 82%,var(--bg) 100%)}
.hs::after{background:linear-gradient(180deg,#000c 0%,#000a 64%,color-mix(in srgb,var(--bg) 45%,#000a) 88%,var(--bg) 100%)}
.hw{position:relative;z-index:1;display:flex;gap:28px;align-items:flex-start;height:100%;padding:calc(var(--top) + 28px) 32px 64px;color:#fff;max-width:1440px;margin:0 auto}
.hw .cover{width:200px;flex:none;box-shadow:0 10px 30px #0008}
.hi{min-width:0;display:flex;flex-direction:column}
.hi h2{margin:0 0 12px;font-size:clamp(1.5rem,3.2vw,2.6rem);font-weight:800;line-height:1.1;letter-spacing:-.02em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.htg{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}.htg span{font-size:.75rem;font-weight:600;background:#ffffff24;padding:2px 9px;border-radius:5px}
.hi p{margin:0;max-width:72ch;color:#ffffffd9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hau{margin:-4px 0 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;color:#fff}.hau span{font-size:.8rem;color:#ffffffb0}.hau b{font-size:1.05rem;margin-right:10px}
.hn{position:absolute;right:32px;bottom:20px;z-index:2;display:flex;gap:8px;align-items:center}
.hn span{font-weight:700;margin-right:6px}
.hn button{width:38px;height:38px;border-radius:50%;border:0;background:var(--s1);display:grid;place-items:center}.hn button:hover{background:var(--ac);color:#fff}

/* ---------- Covers & cards ---------- */
.cover{position:relative;aspect-ratio:7/10;border-radius:6px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 55% 48%),hsl(calc(var(--h) + 50) 55% 26%))}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover b{position:absolute;inset:auto 0 0;padding:28px 9px 9px;color:#fff;font-size:.85rem;line-height:1.25;background:linear-gradient(transparent,#000d)}
.cover img~b{display:none}
.kd{position:absolute;top:6px;left:6px;font-style:normal;font-size:.68rem;font-weight:700;background:#000b;color:#fff;padding:1px 7px;border-radius:4px}
.series{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 16px}
.shelf{display:grid;grid-auto-flow:column;grid-auto-columns:158px;gap:16px;overflow-x:auto;padding-bottom:10px;scroll-snap-type:x proximity;scrollbar-width:thin}
.shelf>*{scroll-snap-align:start}
.sc{display:block}.sc:hover .ct{color:var(--ac)}
.ct{margin-top:8px;font-weight:600;font-size:.9rem;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sc small{display:flex;gap:8px;align-items:center;margin-top:3px;color:var(--mu);font-size:.8rem}
.st{display:inline-flex;align-items:center;gap:5px;font-weight:600;color:var(--on)}.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.done{color:var(--done)}.st.pause{color:var(--pause)}
.pb{display:block;height:3px;background:var(--s2);border-radius:3px;margin-top:6px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}
.rcs{position:relative}.fg{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:#000b;color:#fff;display:none;font-size:.8rem}
.rcs:hover .fg{display:block}@media(hover:none){.fg{display:block}}
.nwb{position:absolute;bottom:6px;right:6px;font-style:normal;font-size:.72rem;font-weight:700;background:var(--ac);color:#fff;padding:1px 7px;border-radius:4px}

/* ---------- Latest updates ---------- */
.lu{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.lui{min-width:0;display:flex;gap:12px;background:var(--s1);border-radius:6px;padding:10px}
.th{position:relative;flex:none;width:60px;aspect-ratio:7/10;border-radius:4px;overflow:hidden;background:linear-gradient(160deg,hsl(var(--h) 55% 48%),hsl(calc(var(--h) + 50) 55% 26%))}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.lub{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.lut{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}.lut:hover{color:var(--ac)}
.luc{display:flex;justify-content:space-between;gap:10px;font-size:.87rem;border-radius:4px;padding:1px 4px;margin:0 -4px}
.luc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.luc small{color:var(--mu);white-space:nowrap}
.luc:hover{background:var(--s2)}.luc.rd span{color:var(--mu)}

/* ---------- Buttons, pills ---------- */
.btn,.tb button{display:inline-flex;align-items:center;gap:7px;border:0;border-radius:6px;padding:9px 16px;font-weight:600;background:var(--s1);color:var(--tx)}
.btn:hover,.tb button:hover{background:var(--s2)}
.btn.pri,.tb button:first-of-type{background:var(--ac);color:#fff}.btn.pri:hover,.tb button:first-of-type:hover{background:var(--ach)}
.btn.on{background:var(--acs);color:var(--ac)}
.btn.dc{background:#5865f2;color:#fff}
[disabled]{opacity:.35;pointer-events:none}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.pill,.tag{display:inline-block;font-size:.78rem;font-weight:600;background:var(--s1);border-radius:5px;padding:2px 9px;color:var(--tx)}
a.pill:hover,a.tag:hover{background:var(--ac);color:#fff}
.tag small{color:var(--mu);margin-left:3px}a.tag:hover small{color:#fffc}
.gc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.lnk{border:0;background:none;color:var(--ac);font-weight:600;padding:0}

/* ---------- Title page ---------- */
.tpb{position:relative;height:330px;margin:calc(-1 * var(--top)) -24px -274px;overflow:hidden;background:#111}
.tp{position:relative;z-index:1}
.tph{display:grid;grid-template-columns:210px minmax(0,1fr);grid-template-areas:"cv t" "cv m";column-gap:26px;padding-top:24px}
.tpcv{grid-area:cv;align-self:start;box-shadow:0 10px 30px #0006}
.tpt{grid-area:t;min-height:162px;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding-bottom:14px;text-shadow:0 1px 12px #0008}
.tpt h1{margin:0;font-size:clamp(1.5rem,3.4vw,3rem);font-weight:800;line-height:1.08;letter-spacing:-.025em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.tpa{margin-top:6px;color:#ffffffd0}
.tpo{margin-top:6px;font-size:1.05rem;font-weight:500;color:#ffffffe0;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.hor{margin:-6px 0 12px;color:#ffffffd0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpx .ibx div div{margin-bottom:2px}
.tpm{grid-area:m;padding-top:14px;display:flex;flex-direction:column;gap:12px}
.tptg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tptg .st{margin-right:6px;font-size:.85rem}
.tpd{margin:24px 0 8px;max-width:90ch}
.sum{white-space:pre-line;margin:0}
.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.tpc{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:28px;margin-top:22px}
.tpx{display:flex;flex-direction:column;gap:16px}
.tpx h4{margin:0 0 4px;font-size:.95rem}.tpx .ibx div{color:var(--mu)}.tpx .ibx .pill{margin:0 4px 4px 0}
.bar2{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.bar2 input{flex:1;min-width:160px;border:0;background:var(--s1);border-radius:6px;padding:8px 12px;outline:none}.bar2 input:focus{box-shadow:0 0 0 2px var(--ac)}
.bar2 button{border:0;background:var(--s1);border-radius:6px;padding:8px 12px;font-weight:600}.bar2 button:hover{background:var(--s2)}
details.vol{margin-bottom:10px}
.vol>summary{display:flex;align-items:center;gap:12px;padding:6px 2px;cursor:pointer;list-style:none;font-weight:700}
.vol>summary::-webkit-details-marker{display:none}
.vol>summary .vc{color:var(--mu);font-weight:500;font-size:.88rem;margin-left:auto}
.vol>summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(45deg);margin:-4px 6px 0 0;transition:transform .2s}
.vol[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.chr{display:flex;gap:4px;margin-bottom:4px}
.ch{flex:1;min-width:0;display:grid;grid-template-columns:16px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:7px 12px;background:var(--s1);border-left:3px solid var(--ac);border-radius:4px}
.ch:hover{background:var(--s2)}
.ch .eye{width:9px;height:9px;border-radius:50%;border:2px solid var(--ac)}
.ch.done{border-left-color:var(--s2)}.ch.done .eye{border-color:var(--mu);background:var(--mu)}.ch.done .cht{color:var(--mu)}
.ch.cur .cht{font-weight:700}
.cht{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch small{color:var(--mu);white-space:nowrap;font-size:.82rem}
.ed{display:grid;place-items:center;width:36px;background:var(--s1);border-radius:4px;color:var(--mu)}.ed:hover{color:var(--ac)}

/* ---------- Reader ---------- */
.rbar{position:sticky;top:var(--top);z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--bd);margin-bottom:14px}
.rbar .t{font-weight:700;flex:1;min-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rbar .t:hover{color:var(--ac)}
.rbar select,.rbar button{border:0;background:var(--s1);border-radius:6px;padding:7px 12px;max-width:240px}
.rbar button:hover{background:var(--s2)}
.rh{max-width:var(--rw,760px);margin:34px auto 0;text-align:center}
.rh .rs{display:inline-block;color:var(--mu);font-size:.9rem;font-weight:600;margin-bottom:10px}.rh .rs:hover{color:var(--ac)}
.rh .rv{color:var(--ac);font-weight:700;font-size:.9rem;margin-bottom:4px}
.rh h1{font-size:clamp(1.45rem,2.6vw,2rem);font-weight:800;line-height:1.3;letter-spacing:-.015em;margin:0 0 10px;text-wrap:balance}
.rh p{color:var(--mu);margin:0;font-size:.9rem}
.nv{display:flex;gap:8px;justify-content:space-between;max-width:var(--rw,760px);margin:26px auto 30px}
.rd.novel{font-size:var(--fs);line-height:var(--lh);max-width:var(--rw,760px);margin:0 auto;padding:8px 2px}
.rd.novel p{margin:0 0 1em}
.rd.novel{font-weight:400}.rd.sans{font-family:"Be Vietnam Pro",system-ui,sans-serif}.rd.serif{font-family:"Noto Serif",Georgia,serif}.rd.bfort{font-family:var(--fb);font-weight:500}
.rd.sepia{background:#f4ecd8;color:#3b3226;padding:24px;border-radius:8px}.rd.night{background:#000;color:#c9cdd9;padding:24px;border-radius:8px}
.rd.manga{max-width:var(--rw,860px);margin:0 auto}.rd.manga img{display:block;width:100%;min-height:200px}
.pgv{position:relative;cursor:pointer;user-select:none}.pgv img{display:block;width:100%;max-height:calc(100vh - 140px);object-fit:contain;background:#000;border-radius:6px}
.pgn{text-align:center;color:var(--mu);font-size:.85rem;margin-top:6px}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ac);z-index:70;opacity:0}

/* ---------- Misc content ---------- */
details.it{background:var(--s1);border-radius:6px;padding:12px 14px;margin-bottom:8px}
details.it>summary{cursor:pointer;font-weight:600}
details.it p{color:var(--mu);margin:8px 0;font-size:.93rem}details.it img{max-width:100%;border-radius:6px;margin-top:8px;cursor:zoom-in}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--s1);border-radius:6px;padding:16px}.card h3{margin:0 0 4px;font-size:1.02rem}.card h3 a:hover{color:var(--ac)}.card p{color:var(--mu);margin:6px 0;font-size:.92rem}
.pj .pi{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;margin-bottom:10px}
.pj .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;color:var(--mu);font-size:.82rem;margin:4px 0 6px}
.pj details{margin-top:10px}.pj summary{cursor:pointer;font-weight:600}
iframe,video{width:100%;border:0;border-radius:6px;background:#000;aspect-ratio:16/9;margin-top:8px}iframe.tool{aspect-ratio:auto;height:480px;background:var(--bg)}
textarea{width:100%;min-height:80px;margin-top:8px;border:0;border-radius:6px;padding:10px;background:var(--bg)}
.tb button{margin:8px 6px 0 0}
#lb{display:none;position:fixed;inset:0;background:#000e;z-index:80;align-items:center;justify-content:center;padding:56px 64px}#lb img{max-width:100%;max-height:100%;object-fit:contain;user-select:none}
.lbb{position:absolute;border:0;background:#ffffff1f;color:#fff;border-radius:50%;width:46px;height:46px;font-size:1.6rem;line-height:1;display:grid;place-items:center}.lbb:hover{background:var(--ac)}
.lbx{top:12px;right:12px;font-size:1.1rem}.lbp{left:12px;top:50%;transform:translateY(-50%)}.lbn{right:12px;top:50%;transform:translateY(-50%)}#lb.one .lbp,#lb.one .lbn{display:none}
.lbc{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);color:#fffc;font-size:.9rem}
@media(max-width:700px){#lb{padding:56px 8px}.lbp,.lbn{top:auto;bottom:8px;transform:none}}
#up{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:grid;place-items:center;z-index:40;box-shadow:0 6px 18px #0003}
.about h3{margin:22px 0 8px}

@media(max-width:700px){
  #top{padding:0 12px;gap:6px}#app{padding:0 14px 48px}

/* =================== Kenrori: giao diện "kệ sách" =================== */
.logo,.sh h2,.hi h2,.tpt h1,.rh h1,.ap h1,.dcta h2,.vhd b,#nv .sg,.cover b{font-family:var(--fd)}
.logo{font-weight:800;letter-spacing:-.01em}.logo i{font-family:var(--fd);font-weight:800;border-radius:3px 8px 8px 3px;box-shadow:inset 4px 0 0 #0003}
.sh h2{font-size:1.4rem;font-weight:800;letter-spacing:0}
#side{background:var(--s1)}
#nv a.on{background:var(--ac);color:#fff;box-shadow:inset 3px 0 0 var(--obi)}

/* Bìa = một cuốn sách: gáy bên trái, góc gáy vuông, bóng đổ */
.cover,.th,.vcv,.vth{border-radius:2px 7px 7px 2px}
.cover{box-shadow:0 1px 1px #0002,0 10px 18px -10px #0007}
.cover::before,.th::before,.vcv::before{content:"";position:absolute;inset:0 auto 0 0;width:8%;max-width:14px;z-index:1;pointer-events:none;background:linear-gradient(90deg,#00000059,#ffffff2b 45%,#0000)}
.cover b{inset:0 0 auto;padding:12px 12px 0 16px;background:none;font-size:1.02rem;font-weight:800;line-height:1.2;text-shadow:0 1px 6px #0006;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
/* Obi: đai giấy quấn quanh bìa */
.obi{position:absolute;left:0;right:0;bottom:9%;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px 4px 12px;background:var(--ac);color:#fff;font-style:normal;font-size:.72rem;font-weight:700;line-height:1.3;box-shadow:0 3px 8px #0005;white-space:nowrap}
.obi em{font-style:normal;background:var(--obi);color:#1b1630;padding:0 6px;border-radius:2px;font-weight:800}
.obi.soon{background:var(--ink);color:#fff}
.sc:hover .cover{transform:translateY(-3px)}.cover{transition:transform .18s ease}
.sc:hover .obi{background:var(--ach)}
.ct{font-weight:700;font-size:.92rem}
.nwt,.kd{display:none}

/* Hero: kệ sách ban đêm, không dùng ảnh nền làm mờ */
.hero{height:520px;background:var(--ink)}
.hb{filter:blur(7px) saturate(1.15);transform:scale(1.12);background-color:var(--ink);background-size:cover;background-position:center 25%}
.hs::after,.tpb::after{background:radial-gradient(80% 110% at 15% 35%,hsl(var(--h,250) 60% 30% / .35),transparent 70%),linear-gradient(180deg,#15131fd9 0%,#15131fa6 50%,color-mix(in srgb,var(--bg) 55%,#15131fa6) 86%,var(--bg) 100%)}

.hw{align-items:center;padding-bottom:84px;gap:44px;padding-right:clamp(32px,11vw,150px)}
.book{position:relative;flex:none;width:220px;transform:rotate(-2deg);transform-origin:bottom left}
.book .cover{display:block;width:100%;box-shadow:0 2px 2px #0003,18px 26px 40px -12px #000c}
.book .obi{bottom:12%;left:-10px;right:-10px;padding:7px 12px 7px 18px;flex-direction:column;align-items:flex-start;gap:0;font-size:.82rem;white-space:normal}

.hor{font-family:var(--fd);font-weight:500;opacity:.85}
.htg span{background:#ffffff1a;border:1px solid #ffffff26;border-radius:999px;padding:2px 10px}
.hi p{max-width:62ch}
