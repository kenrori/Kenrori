<style>

.sum{white-space:pre-line;margin:0}
.bar2{display:flex;gap:8px;margin-bottom:10px}.bar2 input{flex:1;border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:8px 12px}

.ch{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--bd);color:var(--tx)}.ch:hover{background:var(--bg)}.ch:hover span{color:var(--ac)}
.ch.done span{color:var(--mu)}.ch small{color:var(--mu);white-space:nowrap}

#rp button{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:4px 11px;cursor:pointer}#rp span{color:var(--mu);margin-left:8px}
.nv{display:flex;gap:8px;justify-content:space-between;margin:12px 0}
.rd.novel{font-size:var(--fs);line-height:var(--lh);max-width:740px;margin:0 auto;padding:24px;background:var(--card);border:1px solid var(--bd);border-radius:12px}
.rd.serif{font-family:"Noto Serif",Georgia,"Times New Roman",serif}.rd.novel{text-align:left}
.rd.sepia{background:#f4ecd8;color:#3b3226;border-color:#e3d6b5}.rd.night{background:#08090d;color:#c9cdd9;border-color:#1c1f2b}
.rd.manga{max-width:800px;margin:0 auto}.rd.manga img{display:block;width:100%;min-height:200px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:10px}summary{cursor:pointer;font-weight:600}
details p,.card p{color:var(--mu);margin:6px 0;font-size:.93rem}details img{max-width:100%;border-radius:8px;margin-top:8px;cursor:zoom-in}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px}.card h3{margin:0 0 4px;font-size:1.02rem}
iframe,video{width:100%;border:1px solid var(--bd);border-radius:10px;background:#000;aspect-ratio:16/9;margin-top:8px}iframe.tool{aspect-ratio:auto;height:480px}
textarea{width:100%;min-height:80px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;padding:10px;background:var(--bg)}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:var(--ac2);z-index:50;opacity:0}
#up{position:fixed;right:16px;bottom:18px;width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:1.2rem;cursor:pointer;box-shadow:var(--sh);z-index:15}
#lb{display:none;position:fixed;inset:0;background:#000d;z-index:60;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}#lb img{max-width:100%;max-height:100%}
.empty{color:var(--mu);text-align:center;padding:20px 0}footer{text-align:center;color:var(--mu);font-size:.85rem;padding:0 14px 30px}
@media(max-width:560px){.sp .cover{width:140px}dl{grid-template-columns:90px 1fr}.rd.novel{padding:16px}}
.chr{display:flex}.chr .ch{flex:1}.ed{display:flex;align-items:center;padding:0 14px;border-bottom:1px solid var(--bd);color:var(--mu)}.ed:hover{color:var(--ac)}
#adm{background:var(--ac);color:#fff;border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:.9rem;font-weight:600}#adm:hover{opacity:.88}
.gc{margin-bottom:14px}.gc .tag{font-size:.82rem}.tag:hover{border-color:var(--ac);color:var(--ac)}.tag small{opacity:.7}
.cover img~b{display:none}
.cover b{font-size:.9rem;font-weight:600;text-wrap:balance}.cover em{font-size:.66rem;padding:2px 7px}
.ct{margin-top:8px;font-weight:600;font-size:.86rem;line-height:1.3;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance;overflow-wrap:break-word}
.sc:hover .ct{color:var(--ac)}.sc small{margin-top:3px}h1,h2{text-wrap:balance}
.pj .pi{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:8px;margin-bottom:10px;border:1px solid var(--bd)}
.pj .st{float:right;font-size:.7rem;font-weight:600;color:#fff;background:var(--ac2);border-radius:4px;padding:1px 8px}
.pj .meta{color:var(--mu);font-size:.82rem;margin:2px 0 6px}.pj .acts .btn{padding:7px 14px;font-size:.9rem}.pj details{margin:10px 0 0;background:var(--card)}
.pgrid{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.rc{display:flex;align-items:center;gap:4px;border-bottom:1px dashed var(--bd)}.rc .up{flex:1;border-bottom:0;min-width:0}.fg{border:0;background:none;color:var(--mu);cursor:pointer;padding:6px}.fg:hover{color:#d33}
.pb{display:block;height:4px;background:var(--bd);border-radius:4px;margin-top:5px;overflow:hidden}.pb i{display:block;height:100%;background:var(--ac)}.nw{color:var(--ac2);font-weight:600}
/* ===== Polish ===== */
::selection{background:var(--ac);color:#fff}html{scroll-behavior:smooth}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mu) 50%,transparent) transparent}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
body{background:radial-gradient(900px 420px at 8% -5%,color-mix(in srgb,var(--ac) 14%,transparent),transparent),radial-gradient(800px 380px at 96% 0,color-mix(in srgb,var(--ac2) 12%,transparent),transparent),var(--bg);background-attachment:fixed}
.nav{background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px)}
.logo b{background:linear-gradient(135deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
#nv a{transition:.15s}#nv a.on{background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 3px 10px color-mix(in srgb,var(--ac) 40%,transparent)}
#q{transition:.15s}#q:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}
#app>*{animation:fadeUp .35s both}@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}}
.sec{border-radius:16px;box-shadow:var(--sh)}
.sh{border-left:0;padding-left:0}.sh h2{display:flex;align-items:center;gap:9px}.sh h2::before{content:"";width:5px;height:1.15em;border-radius:3px;background:linear-gradient(var(--ac),var(--ac2))}
.banner{position:relative;overflow:hidden;border-radius:18px;padding:28px 24px;margin-bottom:16px;color:#fff;background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:var(--sh)}
.banner::after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:#ffffff22}
.banner h1{margin:0 0 6px;font-size:1.7rem}.banner p{margin:0 0 12px;opacity:.93;max-width:560px}
.banner .btn{background:#fff;color:var(--ac);box-shadow:none}.banner .btn.alt{background:#ffffff26;color:#fff;border-color:#fff9}
.cover{border-radius:12px;box-shadow:0 6px 18px #0003}
.cover::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px #ffffff1f;pointer-events:none}
.cover em{background:linear-gradient(135deg,var(--ac2),#ff6b6b);box-shadow:0 2px 8px #0004}
.sc:hover .cover{transform:translateY(-6px) scale(1.015)}
.btn,.tb button{background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:10px;box-shadow:0 4px 12px color-mix(in srgb,var(--ac) 35%,transparent);transition:.15s}
.btn:hover,.tb button:hover{transform:translateY(-1px);opacity:1}
.btn.alt{background:transparent;box-shadow:none;color:var(--ac);border:1px solid var(--ac)}.btn.alt:hover{background:color-mix(in srgb,var(--ac) 10%,transparent)}
.card{border-radius:14px;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:var(--sh);border-color:color-mix(in srgb,var(--ac) 45%,var(--bd))}
details{border-radius:12px;transition:.2s}details[open]{box-shadow:var(--sh);border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
summary{list-style:none}summary::-webkit-details-marker{display:none}
summary::before{content:"▸";display:inline-block;margin-right:8px;color:var(--ac);transition:.2s}details[open]>summary::before{transform:rotate(90deg)}
.tag{border-radius:999px;padding:2px 11px}a.tag:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
.sp{border-radius:16px;box-shadow:var(--sh);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 7%,var(--card)),var(--card) 60%)}.si h1{font-size:1.7rem}
.up{transition:.15s;border-radius:10px}.up:hover{background:color-mix(in srgb,var(--bg) 70%,transparent);padding-left:8px;padding-right:8px}
.ch{transition:.15s}.chr:nth-child(even) .ch{background:color-mix(in srgb,var(--bg) 55%,transparent)}.ch:hover{padding-left:16px}
.pb i{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.rbar{border-radius:14px;box-shadow:var(--sh)}.rd.novel{border-radius:16px;box-shadow:var(--sh)}
@media(max-width:560px){.banner{padding:22px 18px}.banner h1{font-size:1.4rem}.sec{padding:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
details.vol,details.vol[open]{padding:0;border:0;border-radius:0;box-shadow:none;margin:0 0 10px;background:transparent}
.vol summary{padding:10px 14px;background:var(--bg);border-radius:10px;border:1px solid var(--bd)}.vol summary b{font-size:1rem}.vol[open] summary{border-radius:10px 10px 0 0;border-color:color-mix(in srgb,var(--ac) 40%,var(--bd))}
.vol .chr:last-child .ch{border-bottom:0}
#ann{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;text-align:center;padding:8px 42px 8px 14px;position:relative;font-size:.92rem}#ann a{color:#fff;text-decoration:underline}
#ann button{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:0;color:#fff;font-size:1.1rem;cursor:pointer}
.btn.alt.on{background:var(--ac);color:#fff}.btn.dc{background:#5865f2;box-shadow:none;color:#fff}.cm{margin-top:16px}
.pgv{position:relative;cursor:pointer;user-select:none}.pgv img{display:block;width:100%;max-height:calc(100vh - 110px);object-fit:contain;background:#000;border-radius:8px}.pgn{text-align:center;color:var(--mu);font-size:.85rem;margin-top:6px}
</style>

<script>
/* ============ DATA: CHỈ CẦN SỬA PHẦN NÀY ============ */
const DATA = {

      desc: "Giới thiệu ngắn về bộ truyện.",

        { t: "Chương 1: Khởi đầu", date: "2026-11-01", text: "Đây là đoạn mở đầu.\nĐoạn thứ hai của chương 1." },

        { t: "Chương 3: Hành trình", date: "2026-11-12", file: "novels/vi-du-novel/c3.txt", words: 3200 }

  ],
  manga: [ /* trang: pages:[url,...] hoặc dir + n (+ pad, ext) → dir/01.jpg ... */
    { slug: "vi-du-manga", title: "Tên Manga (ví dụ)", author: "Tác giả", status: "Hoàn thành", cover: "images/bia-2.jpg",
      desc: "Giới thiệu ngắn.",
      chapters: [
        { t: "Chương 1", date: "2026-11-02", dir: "manga/vi-du-manga/c1/", n: 20, pad: 2, ext: "jpg" },

/* ============ CÔNG CỤ TÍCH HỢP ============ */
const W = x => x.trim() ? x.trim().split(/\s+/).length : 0;
const TOOLS = [
 { t: "Sửa lỗi chữ tách dấu tiếng Việt", h: "Chuẩn hóa dấu về dạng chuẩn (NFC), xóa ký tự vô hình và khoảng trắng lạ.", fn: x => x.normalize("NFC").replace(/[\u200B-\u200D\uFEFF]/g, "").replace(/\u00A0/g, " ") },
 { t: "Đếm chữ & ký tự", fn: x => `${W(x)} chữ · ${x.length} ký tự · ${x.split("\n").filter(l => l.trim()).length} đoạn` },
